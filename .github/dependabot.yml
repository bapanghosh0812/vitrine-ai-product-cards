version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
      ai-sdk:
        patterns: ['ai', '@ai-sdk/*']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
