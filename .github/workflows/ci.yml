name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  # Public build-time config (repository variables). Firebase web config is public by design.
  NG_APP_FIREBASE_API_KEY: ${{ vars.NG_APP_FIREBASE_API_KEY }}
  NG_APP_FIREBASE_AUTH_DOMAIN: ${{ vars.NG_APP_FIREBASE_AUTH_DOMAIN }}
  NG_APP_FIREBASE_PROJECT_ID: ${{ vars.NG_APP_FIREBASE_PROJECT_ID }}
  NG_APP_FIREBASE_STORAGE_BUCKET: ${{ vars.NG_APP_FIREBASE_STORAGE_BUCKET }}
  NG_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NG_APP_FIREBASE_MESSAGING_SENDER_ID }}
  NG_APP_FIREBASE_APP_ID: ${{ vars.NG_APP_FIREBASE_APP_ID }}
  NG_APP_SUPPORT_EMAIL: ${{ vars.NG_APP_SUPPORT_EMAIL }}
  NG_APP_SITE_URL: ${{ vars.NG_APP_SITE_URL || 'https://vitrine-ai-product-cards.vercel.app' }}

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Generated content is up to date
        run: node scripts/build-content.mjs --check
      - name: Secret scan (secretlint)
        run: npx secretlint --maskSecrets "**/*"
      - run: npm run env
      - name: Lint
        run: npm run lint
      - name: Typecheck (app + server)
        run: npm run typecheck
      - name: Unit and component tests (Angular, Vitest)
        run: npm test
      - name: API tests (Hono, Vitest)
        run: npm run test:api
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Build (static + prerender)
        run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/vitrine/browser, retention-days: 3 }

  rules:
    name: Firestore rules tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci --no-audit --no-fund
      - run: npx -y firebase-tools@latest emulators:exec --only firestore --project demo-vitrine "npx vitest run --config vitest.rules.config.ts"

  e2e:
    name: E2E (Chromium, Firefox, WebKit, mobile)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/vitrine/browser }
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------ CD (gated on CI)
  deploy-vercel:
    name: Deploy to Vercel
    needs: [quality, rules, e2e, gitleaks]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - name: Skip when Vercel is not configured
        id: check
        run: echo "enabled=${{ env.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.enabled == 'true'
        run: npm ci --no-audit --no-fund && npm i -g vercel@latest
      - if: steps.check.outputs.enabled == 'true'
        run: vercel pull --yes --environment=${{ github.event_name == 'pull_request' && 'preview' || 'production' }} --token="$VERCEL_TOKEN"
      - if: steps.check.outputs.enabled == 'true'
        run: npm run build:vercel
      - if: steps.check.outputs.enabled == 'true'
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ github.event_name != 'pull_request' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Vercel: $url" >> "$GITHUB_STEP_SUMMARY"

  deploy-netlify:
    name: Deploy to Netlify
    needs: [quality, rules, e2e, gitleaks]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - name: Skip when Netlify is not configured
        id: check
        run: echo "enabled=${{ env.NETLIFY_AUTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.enabled == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.check.outputs.enabled == 'true'
        run: npm run build:netlify
      - if: steps.check.outputs.enabled == 'true'
        id: deploy
        run: |
          out=$(npx -y netlify-cli@latest deploy --dir=dist/vitrine/browser --functions=netlify/functions ${{ github.event_name != 'pull_request' && '--prod' || '--alias=pr-${{ github.event.number }}' }} --message="${{ github.sha }}" --json)
          url=$(echo "$out" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(j.deploy_url||j.url)})")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Netlify: $url" >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [quality, rules, e2e, gitleaks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.pages.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --no-audit --no-fund
      - uses: actions/configure-pages@v5
      - name: Build for GitHub Pages (API served by Vercel)
        run: npm run build:pages
        env:
          NG_APP_API_BASE: ${{ vars.NG_APP_API_BASE || 'https://vitrine-ai-product-cards.vercel.app' }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/vitrine/browser }
      - id: pages
        uses: actions/deploy-pages@v4

  preview-comment:
    name: Post preview links
    needs: [deploy-vercel, deploy-netlify]
    if: github.event_name == 'pull_request' && (needs.deploy-vercel.outputs.url != '' || needs.deploy-netlify.outputs.url != '')
    runs-on: ubuntu-latest
    permissions: { pull-requests: write }
    steps:
      - uses: actions/github-script@v7
        env:
          VERCEL_URL: ${{ needs.deploy-vercel.outputs.url }}
          NETLIFY_URL: ${{ needs.deploy-netlify.outputs.url }}
        with:
          script: |
            const marker = '<!-- vitrine-preview -->';
            const body = `${marker}\n### Preview deployments\n| Host | URL |\n| --- | --- |\n| Vercel | ${process.env.VERCEL_URL || 'not configured'} |\n| Netlify | ${process.env.NETLIFY_URL || 'not configured'} |\n\nCommit ${context.sha.slice(0, 7)}`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
