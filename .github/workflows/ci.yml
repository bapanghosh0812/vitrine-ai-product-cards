name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  # Public build-time config (repository variables). Firebase web config is public by design.
  NG_APP_FIREBASE_API_KEY: ${{ vars.NG_APP_FIREBASE_API_KEY }}
  NG_APP_FIREBASE_AUTH_DOMAIN: ${{ vars.NG_APP_FIREBASE_AUTH_DOMAIN }}
  NG_APP_FIREBASE_PROJECT_ID: ${{ vars.NG_APP_FIREBASE_PROJECT_ID }}
  NG_APP_FIREBASE_STORAGE_BUCKET: ${{ vars.NG_APP_FIREBASE_STORAGE_BUCKET }}
  NG_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NG_APP_FIREBASE_MESSAGING_SENDER_ID }}
  NG_APP_FIREBASE_APP_ID: ${{ vars.NG_APP_FIREBASE_APP_ID }}
  NG_APP_SUPPORT_EMAIL: ${{ vars.NG_APP_SUPPORT_EMAIL }}
  NG_APP_SITE_URL: ${{ vars.NG_APP_SITE_URL || 'https://vitrine-ai-product-cards.vercel.app' }}

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Generated content is up to date
        run: node scripts/build-content.mjs --check
      - name: Secret scan (secretlint)
        run: npx secretlint --maskSecrets "**/*"
      - run: npm run env
      - name: Lint
        run: npm run lint
      - name: Typecheck (app + server)
        run: npm run typecheck
      - name: Unit and component tests (Angular, Vitest)
        run: npm test
      - name: API tests (Hono, Vitest)
        run: npm run test:api
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
      # Same output the hosts serve: prerendered pages plus CSP headers, sitemap and robots.txt.
      - name: Build (static + prerender + postbuild)
        run: npm run build:netlify
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/vitrine/browser, retention-days: 3 }

  rules:
    name: Firestore rules tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci --no-audit --no-fund
      - run: npx -y firebase-tools@latest emulators:exec --only firestore --project demo-vitrine "npx vitest run --config vitest.rules.config.ts"

  # One job per browser: they run in parallel, and a stuck browser cannot hold up the others.
  e2e:
    name: E2E (${{ matrix.project }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: mobile-chrome, browser: chromium }
          - { project: mobile-safari, browser: webkit }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist/vitrine/browser }
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }}
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: 'playwright-report-${{ matrix.project }}', path: playwright-report, retention-days: 7, if-no-files-found: ignore }

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # The CLI scans the whole history on every run. (gitleaks-action builds a "<first>^..<last>"
      # range from the push payload, which breaks on a repository's first push.)
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${file}\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
      - name: Scan the full git history
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1 --report-format sarif --report-path gitleaks.sarif
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: gitleaks-results, path: gitleaks.sarif, if-no-files-found: ignore, retention-days: 7 }

  # ------------------------------------------------------------------ CD
  # GitHub Pages deploys from here, only after every check above passes.
  # Vercel and Netlify deploy through their Git integrations: production on every push to main
  # and a preview URL on every pull request (shown in the PR's checks and deployments).
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [quality, rules, e2e, gitleaks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.pages.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --no-audit --no-fund
      - uses: actions/configure-pages@v6
      - name: Build for GitHub Pages (API served by Vercel)
        run: npm run build:pages
        env:
          NG_APP_API_BASE: ${{ vars.NG_APP_API_BASE || 'https://vitrine-ai-product-cards.vercel.app' }}
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist/vitrine/browser }
      - id: pages
        uses: actions/deploy-pages@v5
