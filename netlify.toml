# Netlify: static Angular build + one Netlify Function for the Hono API.
[build]
  command = "npm run build:netlify"
  publish = "dist/vitrine/browser"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--no-audit --no-fund"
  AI_BUDGET_MS = "8500"

[functions]
  # Bundle everything (like the Vercel build). Keeping firebase-admin external made the runtime
  # require() the ESM-only "jose" package, which older Lambda Node versions cannot do.
  node_bundler = "esbuild"

# API: /api/* -> the "api" function (the function normalises the path back to /api/*)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback for client-rendered routes (prerendered pages are served as files first)
[[redirects]]
  from = "/*"
  to = "/index.csr.html"
  status = 200
